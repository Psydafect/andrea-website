<style>
/* Self-hosted fonts (see build_name.py). The name's hand-drawn letters are SVG outlines, not a web font. */
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(assets/fonts/inter-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(assets/fonts/inter-latin-ext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  --paper:#F1EDE4; --ink:#1A1916; --muted:rgba(26,25,22,.46); --faint:rgba(26,25,22,.22);
  --accent:#B04A2E; /* arbutus bark */
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:clamp(14px,1.6vw,24px); --gap:clamp(10px,1.3vw,20px); --top:68px;
  --ease:cubic-bezier(.22,1,.36,1);
  --dw:8.4em;   /* the date column on Writing and the CV */
  --heart:#D9262B;
}
/* the heart's colour scheme: red paper, pink ink (pink on red is 4.6:1) */
[data-theme="love"]{--paper:#C0142A; --ink:#FFD1DC; --muted:rgba(255,209,220,.72); --faint:rgba(255,209,220,.3); --accent:#FFD1DC; --heart:#FFD1DC}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 13px/1.45 var(--sans);letter-spacing:-.003em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .6s var(--ease),color .6s var(--ease)}
a{color:inherit;text-decoration:none}
p a,.x a,.cv a,.ct a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:var(--faint);transition:text-decoration-color .3s}
p a:hover,.x a:hover,.cv a:hover,.ct a:hover{text-decoration-color:currentColor}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p,ul,figure{margin:0;padding:0;font:inherit}
ul{list-style:none}
::selection{background:var(--ink);color:var(--paper)}
.m,.mono{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:1px solid currentColor;outline-offset:3px}

/* links that draw a line underneath, growing from the right and leaving to the left. The line is a
   drifting cloud of reds and pinks: a colour band sliding one way, a soft white shimmer the other,
   each moving a whole tile per loop so it never jumps (idea from jacobcummings.com's name) */
:root{--ln1:#B3122A;--ln2:#E8324A;--ln3:#F48FA6;--ln4:#FFD3DE;--lnw:rgba(255,255,255,.75);--lng:rgba(244,143,166,.65)}
[data-theme="love"]{--ln1:#FF7A99;--ln2:#FFB3C6;--ln3:#FFE4EB;--ln4:#FFFFFF;--lnw:rgba(255,255,255,.85);--lng:rgba(255,209,220,.7)}
.ln{position:relative}
.ln::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--lnw) 50%,transparent) 0 0/150px 100% repeat-x,
    linear-gradient(90deg,var(--ln1),var(--ln2) 22%,var(--ln4) 42%,var(--ln3) 58%,var(--ln2) 78%,var(--ln1)) 0 0/260px 100% repeat-x;
  filter:drop-shadow(0 0 2px var(--lng));
  animation:cloud 7s linear infinite;
  transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
.ln:hover::after,.ln:focus-visible::after,.ln.on::after,.mark::after{transform:scaleX(1);transform-origin:right}
@keyframes cloud{to{background-position:-450px 0,260px 0}}

/* ---------- header ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px var(--gut) 14px;background:var(--paper);transition:background-color .6s var(--ease)}
.is-home .hd{background:transparent}
.is-home .mark{visibility:hidden}
.nav{display:flex;align-items:center;gap:clamp(14px,1.6vw,26px)}
/* the heart: switches the colour scheme; the loader's heart lands here */
.sky{display:block;width:20px;height:20px;margin-left:clamp(4px,.8vw,14px);color:var(--heart);transition:color .6s var(--ease)}
.sky svg{display:block;width:100%;height:100%;overflow:visible;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.sky path{fill:currentColor}
.sky:hover svg{transform:scale(1.15) rotate(-6deg)}
.sky.pop svg{animation:beat .55s var(--ease)}
@keyframes beat{30%{transform:scale(1.35)}60%{transform:scale(.92)}}
.loading .sky{opacity:0}

main{transition:opacity .18s linear}
main.out{opacity:0}

/* ---------- home ---------- */
.home{height:100svh;min-height:520px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:auto 1fr auto;column-gap:var(--gap);padding:var(--top) var(--gut) clamp(10px,1.4vw,20px)}
.bio{grid-column:1/5;grid-row:1;max-width:52ch}
.bio p+p{margin-top:.75em}
.portrait{grid-column:8/span 3;grid-row:1;width:100%;max-width:280px}
.portrait .ph{aspect-ratio:823/1024;background:var(--faint);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter .9s var(--ease)}
.portrait:hover img{filter:none}
.portrait figcaption{margin-top:6px;color:var(--muted)}
.name{grid-column:1/-1;grid-row:3;align-self:end;margin-top:28px;font-weight:380;font-size:min(13vw,190px);line-height:.8;letter-spacing:-.03em;color:var(--ink);cursor:default;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.name svg{display:block;fill:currentColor;overflow:visible}
.name svg+svg{margin-top:.05em}
.name.ready .name-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- pages ---------- */
.page{padding:var(--top) var(--gut) 48px;min-height:100svh}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap)}


/* curatorial: three columns hung from one line. The title's first line, the current row of the
   list and the top of the image all sit on --line; the wheel steps through the projects. */
.is-cx,.is-cx body{overflow:hidden;height:100%}
.cx{--line:38svh;--ts:clamp(22px,1.95vw,30px);
  --c1:clamp(240px,26vw,390px); --c2:clamp(232px,18vw,270px); --c3:clamp(288px,31vw,480px); --g:clamp(40px,5.5vw,96px);
  --x0:calc(50% - (var(--c1) + var(--c2) + var(--c3) + 2*var(--g))/2);
  position:fixed;inset:0;overflow:hidden;touch-action:none}
/* one centred group: details flush right against the list, list in the middle, image flush left after it */
.cx-info{position:absolute;left:var(--x0);width:var(--c1);top:calc(var(--line) - var(--ts)*.53);text-align:right}
.cx-d{position:absolute;left:0;right:0;top:0;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .3s,transform .5s var(--ease),visibility 0s .3s}
.cx-d.on{opacity:1;visibility:visible;transform:none;transition:opacity .55s var(--ease) .1s,transform .8s var(--ease) .1s}
.cx-d .loc{position:absolute;left:0;right:0;bottom:100%;margin-bottom:10px;color:var(--muted)}
.cx-d h2{font-size:var(--ts);line-height:1.06;letter-spacing:-.03em;font-weight:600}
.cx-d h2 a::after{bottom:-1px}
.cx-d .art{margin:14px 0 0 auto;max-width:38ch}
.cx-d .when{margin-top:2px;color:var(--muted)}
.cx-list{position:absolute;left:calc(var(--x0) + var(--c1) + var(--g));width:var(--c2);top:var(--line);transition:transform .6s var(--ease)}
.cx-list a{display:flex;justify-content:space-between;gap:20px;padding:2px 0;white-space:nowrap;opacity:.16;transition:opacity .45s var(--ease)}
.cx-list a.on{opacity:1}
.cx-list a.n1{opacity:.42}
.cx-list a.n2{opacity:.26}
.cx-list a:not(.on):hover{opacity:.7}
.cx-pics{position:absolute;left:calc(var(--x0) + var(--c1) + var(--c2) + 2*var(--g));width:var(--c3);top:var(--line);height:min(calc(100svh - var(--line) - 11svh),calc(var(--c3)*1.25))}
.cx-im{position:absolute;inset:0;display:flex;justify-content:flex-start;align-items:flex-start;opacity:0;transition:opacity .7s var(--ease)}
.cx-im.on{opacity:1;transition:opacity .9s var(--ease) .1s}
.cx-im img{max-width:100%;max-height:100%;width:auto;height:auto;transform:scale(.985);transform-origin:0 0;transition:transform 1.4s var(--ease)}
.cx-im.on img{transform:none}
/* only the shown image takes clicks (it opens the project); hovering it draws the title's line */
.cx-im{pointer-events:none}
.cx-im.on img{pointer-events:auto;cursor:pointer}
.cx.pic .cx-d.on h2 a::after{transform:scaleX(1);transform-origin:right}
.cx-hint{position:absolute;left:0;right:0;bottom:clamp(20px,4svh,40px);text-align:center;color:var(--muted);transition:opacity .6s}
.cx.moved .cx-hint{opacity:0}

/* cv: one index per section, years only */
.cvs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);margin-bottom:clamp(36px,6vh,64px)}
.cvs>h2{grid-column:1/3;font-weight:600;position:sticky;top:var(--top);align-self:start}
.cvs>.rows{grid-column:3/10}
.cr{display:grid;grid-template-columns:var(--dw) minmax(0,1fr);column-gap:var(--gap)}
.cr+.cr{margin-top:5px}
.cr .y{color:var(--muted)}
.cr .x .m{display:inline}
.cr .d{color:var(--muted);max-width:66ch;margin-top:3px}
.cr .rl{color:var(--muted)}
.cr.wx .y{white-space:nowrap}
.cr.wx .x{color:var(--muted)}
.cr.wx .x a,.cr.wx .x .t{color:var(--ink)}
.cr.wx .d ul{margin-top:.4em}
.cr.wx .d li+li{margin-top:.2em}
.cr.sub .x{padding-left:1.4em}
.cr.lead{margin-top:10px}
.cr.lead .x{color:var(--muted)}
.cr details summary{list-style:none;cursor:pointer}
.cr details summary::-webkit-details-marker{display:none}
.cr details summary::after{content:"\00a0+";color:var(--muted)}
.cr details[open] summary::after{content:"\00a0–"}
.cr details .d{margin:0;padding:3px 0 8px}
.cr details .d p+p{margin-top:.5em}
/* jobs: org and roles stay visible, the description opens with + after the org */
.cr details.job summary::after{content:none}
.cr details.job .pm::after{content:"\00a0+";color:var(--muted)}
.cr details.job[open] .pm::after{content:"\00a0–"}

/* contact */
.ct{max-width:46ch}
.ct p+p{margin-top:1em}

/* project */
.pj{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:start;padding:var(--top) var(--gut) 48px}
/* text and images are two sections: the text stays pinned and scrolls on its own when it's long,
   the images scroll the page; a fade at the text's foot says there's more */
.pj-txt{grid-column:1/5;position:sticky;top:var(--top);max-height:calc(100svh - var(--top));overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:none;padding:0 4px 40px;margin:0 -4px}
.pj-txt::-webkit-scrollbar{display:none}
.pj-txt{--mt:0px;--mb:0px;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 var(--mt),#000 calc(100% - var(--mb)),transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 var(--mt),#000 calc(100% - var(--mb)),transparent)}
.pj-txt.past{--mt:40px}
.pj-txt.more{--mb:72px}
.pj-txt h1{font-weight:500}
.pj-txt .meta{color:var(--muted);margin-bottom:18px}
.pj-txt>p,.pj-txt>ul,.pj-txt>.poem,.pj-txt>.links{max-width:58ch;margin-bottom:.8em}
.pj-txt>h3{font-weight:500;margin:1.8em 0 .4em}
.pj-txt .poem{font-style:italic}
.pj-txt .links a{display:block;text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:2px}
.pj-txt .gap{height:1.2em}
.pj-nav{display:flex;justify-content:space-between;gap:20px;margin-top:28px;max-width:58ch}
.pj-img{grid-column:6/-1;display:flex;flex-direction:column;gap:clamp(24px,4vh,48px)}
.pj-img figure img{max-height:calc(100svh - var(--top) - 40px);width:auto;max-width:100%;cursor:zoom-in;background:var(--faint)}
.pj-img figcaption{margin-top:6px;color:var(--muted);max-width:70ch}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.lb.open{opacity:1;visibility:visible}
.lb-top,.lb-bot{display:flex;justify-content:space-between;gap:20px;padding:16px var(--gut)}
.lb-stage{position:relative;display:grid;place-items:center;min-height:0;padding:0 var(--gut)}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb-hit{position:absolute;top:0;bottom:0;width:50%}
.lb-hit.l{left:0;cursor:w-resize}.lb-hit.r{right:0;cursor:e-resize}
.lb-bot p{color:var(--muted);max-width:80ch}
.toast{position:fixed;left:var(--gut);bottom:16px;z-index:70;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}

/* ---------- small screens ---------- */
@media (max-width:820px){
  :root{--top:84px}
  .hd{flex-wrap:wrap;row-gap:8px;padding-top:14px}
  .nav{order:3;width:100%;justify-content:flex-start}
  .is-home .mark{display:none}
  .is-home .nav{order:0}
  .home{height:auto;min-height:100svh;display:flex;flex-direction:column;gap:24px;padding-top:var(--top)}
  .name{order:1;margin-top:8px;align-self:stretch}
  .portrait{order:2;width:62%;max-width:300px}
  .bio{order:3;max-width:none;font-size:14px}
  .cvs{display:block}
  /* phones: the list band sits on the line, details under it, the image held at the bottom */
  /* phones: the same line, stacked: rows above it fade out, the image hangs from it, details sit under the image */
  .cx{--line:calc(var(--top) + 96px);--ts:22px;--ph:40svh}
  .cx-hint{display:none}
  .cx-list{left:var(--gut);right:var(--gut);width:auto}
  .cx-list a{opacity:0}
  .cx-list a.after{opacity:0}
  .cx-list a span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cx-pics{left:var(--gut);right:var(--gut);width:auto;top:calc(var(--line) + 18px);height:var(--ph)}
  .cx-info{top:calc(var(--line) + 18px + var(--ph) + 20px);left:var(--gut);right:var(--gut);width:auto;text-align:left}
  .cx-d .loc{position:static;margin:0 0 4px}
  .cx-d .art{margin:8px 0 0}
  .cx-im img{width:100%;height:100%;object-fit:cover}
  .cvs>h2{margin-bottom:6px;position:static}
  .cr{display:block}
  .cr .y{display:block;font-size:12px}
  .cr+.cr{margin-top:12px}
  .cr.lead{margin-top:14px}
  .cr.sub+.cr.sub{margin-top:8px}
  .pj{display:flex;flex-direction:column;gap:32px}
  .pj-txt{position:static;max-height:none;overflow:visible;padding:0;margin:0}
  .pj-txt{-webkit-mask-image:none;mask-image:none}
  .pj-img figure img{max-height:none;width:100%}
}
/* loader: a V-shaped heart draws itself in one line, fills, and the page fades in */
.ld{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--paper);transition:background-color .9s var(--ease)}
.ld.fly{background-color:transparent;pointer-events:none}
.ld svg{width:48px;height:auto;overflow:visible}
.ld path{fill:var(--heart);fill-opacity:0;stroke:var(--heart);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:ld-draw 1.3s cubic-bezier(.65,0,.35,1) .15s forwards,ld-fill .5s var(--ease) 1.35s forwards}
@keyframes ld-draw{to{stroke-dashoffset:0}}
@keyframes ld-fill{to{fill-opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}.ld{display:none}}
</style>
</head>

<script>
/* Images live in ./assets/ (mirrored from the old WordPress site; originals at
   https://avalentinelewis.com/wp-content/). See fetch_images.py / optimize_images.py. */
const BASE = './assets/';
const im = p => BASE + (p.startsWith('themes/') ? p : 'uploads/' + p);
const th = p => BASE + 'thumbs/uploads/' + p;   // 900px versions for previews

const L = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
const I = (slug, text) => `<a href="#/curatorial/${slug}">${text}</a>`;

/* ---------------- CONTENT ---------------- */
const HOME = {
  portrait: '2022/07/AVL_Headshot_2022-823x1024.jpg',
  credit: 'Photo by Dylan Maranda 2022',
  p1: `Andrea Valentine-Lewis (she/her) is a curator and writer focused on contemporary art, based on the traditional and unceded territories of the xʷməθkʷəy̓əm (Musqueam), Sḵwx̱wú7mesh (Squamish), and səlilwətaɬ (Tsleil-Waututh) peoples, also known as Vancouver, Canada.`,
  rest: [
    `She was raised on the land of the W̱SÁNEĆ People—the Salt Water People—in what is also known as Brentwood Bay (Tsartlip), a coastal and rural region of Vancouver Island abundant with arbutus trees, ravens, and blackberry bushes.`,
    `For the past 3.5 years, she has served as Curatorial Assistant at the Vancouver Art Gallery, where she has worked on ten exhibitions and contributed writing to four publications.`,
    `As an independent curator, her recent work focuses on generational mentorship and legacy within the arts. Her upcoming exhibition, ${L('https://smithfoundation.co/exhibitions-items/one-hundred-artists-deep-april-10th-june-20th-2026/?portfolioCats=59%2C60%2C58','One Hundred Artists Deep')}, developed through her Curatorial Fellowship at the Gordon and Marion Smith Foundation for Young Artists, opens at the Gordon Smith Gallery from April 11 to June 20, 2026. The opening reception will take place April 11 from 6–8pm.`,
    `When she is not working, she enjoys spending time with her partner Dylan, reading, dancing, exercising, spending time with friends and family, and watching trash television.`
  ]

P('nightcrawlers',{
  title:'Nightcrawlers', year:'2025', kind:'Group Exhibition', venue:'Access Gallery',
  thumb:'2025/02/01-1-scaled.jpg',
  meta:['Group Exhibition','Curated by Andrea Valentine-Lewis','Access Gallery, Vancouver, BC','July 25 – September 27, 2025','Curator’s Tour September 20 at 2pm'],
  blocks:[
    img('2025/02/NightCrawlers_01.jpg','Installation view of Nightcrawlers. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_02.jpg','Installation view of Nightcrawlers. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_04.jpg','Installation view of Sara Angelucci, August 30, Lucifer Crocosmia with insect, 2019, linen vinyl. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_05.jpg','Installation view of Nightcrawlers. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_06.jpg','Installation view of Bill Jackson, Night Walker, video, 2025. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_07.jpg','Installation view of Pia-Paulina Guilmoth, orchard (ghillie suit, apples, Scent Killer Gold), 2022, archival pigment print. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_08.jpg','Installation view of a selection from Deepti Asthana, The Sweet Kiss of Monsoon Nights, 2019, inkjet prints. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_09-scaled.jpg','Installation view of Nightcrawlers. Photo: Rachel Topham Photography.'),
    img('2025/02/NightCrawlers_10-scaled.jpg','Installation view of Sara Angelucci, October 14, Milkweed #2, 2019, inkjet print on Dibond, Courtesy of the Artist and Stephen Bulger Gallery. Photo: Rachel Topham Photography.'),
    p(`After dusk, artificial city lights pollute the very rhythms that make us creatures of this earth. Orange- and blue- toned streetlights built for surveillance bleed rays into our domestic spaces, obscuring our perception of time. The night, and the reprieve from productivity it offers, is held hostage as fluorescence stands in for sunlight.`),
    p(`Before artificial illumination flooded the streets in the late 19th century, the night was thick with darkness that inviolably marked the end of day. After-dusk wanderers were at risk of plummeting off of unseen cliffs or stumbling into treacherous areas. When vision is responsible for 80% of how sighted humans perceive the world around them, the darkness of night has always had consequences. But even as light pollution increasingly encroaches, disrupting migratory birds, pollinating insects, and other nocturnal animals, there are still dark places that exist, and creatures that inhabit them.`),
    p(`Nightcrawlers features the work of four contemporary artists—Sara Angelucci (Toronto, ON), Deepti Asthana (Goa, India), Pia-Paulina Guilmoth (Central Maine, United States), and Bill Jackson (Suffolk, England)—who encounter and engage with nature at night, capturing their discoveries using varying lens-based methods. All four are motivated to practice at night for different reasons: they consider the night as a protective time/space, they are influenced by their social position, they are interested in the ecological dimension of the night, or they are drawn to it following loss. Documenting their encounters through photography, scanning, and infrared sensing, they facilitate an imprint of the affective dimension or ‘aura’ of the night.`),
    rule,
    p(`Following her sister’s premature death in 2015 and wanting to dedicate a body of work to her, Sara Angelucci found herself called to the garden; through working in quiet darkness and encountering various plant species, buzzing insects, and nocturnal creatures, she finally felt her grief shift.`),
    p(`Growing up in India, Deepti Asthana understood that the period between dusk and dawn was dangerous for women. Asthana’s project The sweet kiss of monsoon night, documents her discoveries while exploring the night despite the potential threats to her safety.`),
    p(`Pia-Paulina Guilmoth’s relationship to the night has shifted since her gender transition within a right-wing county in rural Maine. Before, the night was a dark aesthetic backdrop for photographic compositions, and now, it is a safe-haven of queer illegibility.`),
    p(`Deeply concerned by the British government’s recent plans for deforesting large areas of Suffolk’s ancient woodland, Bill Jackson’s meditative, infrared video work endeavors to draw out the affective, sensorial, and otherworldly dimension of the natural landscape at night.`),
    p(`Nightcrawlers is an ode to a disappearing nightscape. An ode to the tensions present in night—fear, alongside curiosity; the human and the more-than-human; life before, and life after.`),
    img('2025/02/DeeptiAsthana_Sweetkiss_01-2048x1396.jpg','Deepti Asthana, from the series The sweet kiss of monsoon night, 2019, inkjet print.'),
    img('2025/02/Pia-PaulinaGuilmoth_01-2048x1612.jpg','Pia-Paulina Guilmoth, orchard (ghillie suit, apples, Scent Killer Gold), 2022, archival pigment print.'),
    img('2025/02/SaraAngelucci_Milkweed.jpg','Sara Angelucci, October 14, Milkweed #2, 2019, inkjet print on Dibond, Courtesy of the Artist and Stephen Bulger Gallery.'),
    img('2025/02/BillJackson_NightWalker_Still-1.png','Bill Jackson, Night Walker, video (still), 2025.'),
    h('Bios:'),
    p(`Sara Angelucci is a Toronto-based artist working in photography, video, audio, and installation. Over the years her projects have drawn from a range of personal photographs and films—to anonymous and found images. Based in the history of photography – from vernacular snapshots to professional studio portraiture—the history outside the image frame informs the direction of her research into natural and social histories implicated in the photograph. Since 2013 her projects have focused on our fraught relationship with the natural world, channeling personal and environmental grief. Sara Angelucci completed her BA at the University of Guelph and her MFA at the Nova Scotia College of Art and Design. She is an Adjunct Professor in Photography at the School of Image Arts Toronto Metropolitan University and is represented by the Stephen Bulger Gallery in Toronto.`),
    p(`Deepti Asthana is a versatile artist who excels as an independent photographer, filmmaker, educator, and National Geographic Explorer. Her work primarily addresses gender and environmental issues within traditional Indian societies, reflecting her experiences growing up in a patriarchal small town in Northern India. Leaving her IT career behind, she pursued her passion for photography, further honing her skills with a diploma from the Danish School of Media and Journalism, Denmark. In 2020, her talent was recognised by World Press Photo when she was awarded under their prestigious Global Talent 6*6 program.`),
    p(`Pia-Paulina Guilmoth lives and makes art in rural central Maine. Pia is a working-class transgender woman who lives with her girlfriend and two cats. Pia’s work is foremost about harnessing beauty as a form of resistance to a world full of terrors. Pia released her third book in November 2024 with Stanley/Barker titled Flowers Drink the River. In 2024-2025 she had two major solo exhibitions with Webber Gallery (London) and CLAMP (New York). In 2024 she won a Google/Aperture Creator Labs grant, and a Peter Reed Foundation grant in photography. In 2022 she was a MacDowell Fellow in Visual Arts. From 2018 to 2021 she was the winner of the Fujifilm Young Talent Award, a Mass Cultural Council fellow in photography, and a finalist for the Aperture Portfolio Prize.`),
    p(`Bill Jackson graduated from Coventry School of Art and Birmingham Institute of Art in the UK. He has worked as a stills photographer in television and theatre and spent 28 years lecturing and running programmes in film, photography and electronic media in several art schools. His art practice spans over 45 years and has been exhibited widely including the USA, Argentina, Italy and Japan. His work has received over 50 international awards. He currently lives and works in coastal Suffolk and recently has been collaborating with musicians including the estate of Nick Drake, for the album The Endless Coloured Ways.`)
  ]}),
P('spotlight-in-visible',{
  title:'SPOTLIGHT: in/visible', year:'2024', kind:'Window installation', venue:'Vancouver Art Gallery',
  thumb:'2024/03/flat-pattern.jpg',
  meta:['Janet Wang','Curated by Andrea Valentine-Lewis','Vancouver Art Gallery, Vancouver, BC','April 19, 2024 – April 14, 2025'],
  blocks:[
    img('2024/04/IMG_9931-scaled.jpg'),
    p(`SPOTLIGHT presented by RBC is a collaboration between the Art Rental &amp; Sales Program (AR&amp;S) and the Curatorial Department of the Vancouver Art Gallery. AR&amp;S is a not-for-profit program operated by the Gallery with a mandate of supporting emerging artists based in British Columbia.`),
    p(`In this collaboration, the Curatorial Department at the Gallery invites an artist represented by AR&amp;S to create an artwork in one of the Gallery’s public spaces. This initiative aims to provide new opportunities for emerging artists, as well as to activate the Gallery’s public spaces for thousands of visitors each year.`),
    img('2024/04/IMG_9928-scaled.jpg'),
    p(`This current iteration of SPOTLIGHT features Vancouver-based artist Janet Wang, who works across a range of media, from illustration, painting and installation to digital media, such as augmented reality and animation. In her art, Wang reimagines traditional patterns often used in drapery and wallpaper—such as Toile de Jouy (an ornate French textile pattern featuring images of rural life) and Chinoiserie (a European artistic interpretation of Asian decorative arts). She also refashions art historical references to tell contemporary, everyday stories. In her wallpaper pieces, Wang centres stories of Chinese Canadians, drawing on her lived experience as a second-generation settler of Chinese heritage. She frequently transforms her designs into installations that occupy underutilized windows or built spaces.`),
    img('2024/04/flat-pattern-1.jpg'),
    p(`For her SPOTLIGHT project, Wang is presenting in/visible—a pattern she created based on a decorative toile motif by French artist Jean-Baptiste Marie Huet titled ${L('https://artsandculture.google.com/asset/le-ballon-de-gonesse-jean-baptiste-marie-huet-french-1745-1811/lAFfgrdfVFzZ7g?hl=en','Le Ballon de Gonesse')} (1784). Huet’s 18th century pattern renders scenes of villagers as a hot air balloon from the nearby city of Paris lands in their fields. Mistaking the unusual flying balloon for a monster, they attack it with pitchforks upon its descent. Wang reworks the narrative to reflect the cultural erasure experienced by many Chinatowns across North America. Her toile pattern is composed of several repeated scenes and references to well-known paintings. One vignette alludes to Édouard Manet’s Le Déjeuner sur l’herbe (1863), where Wang’s lounging figure is pictured with a disposable coffee cup rather than the picnic lunch in Manet’s original. Wang playfully inserts familiar imagery in her work as an entry point for telling everyday stories.`),
    img('2024/04/IMG_9947.jpg'),
    p(`Janet Wang (b. 1977, Vancouver, BC) is a visual artist and educator whose pluralistic practice encompasses traditional painting, installation work and digital media. As a second-generation settler of Chinese heritage, Wang centres her research around the question of what it means to be Chinese in Canada. Her art plays with familiar decorative and art historical motifs, which she reworks through the introduction of contemporary landmarks and social narratives. Wang is an Associate Professor in the Department of Critical and Cultural Practice at Emily Carr University of Art + Design.`)
  ]}),

    p(`Featuring new and recent works by nine artists, Around Us explores circuitous representations of self, moving beyond conventional self-portraiture in favour of abstracted, adjacent, or satirical portrayals. The exhibition encompasses multiple material approaches united through the medium of photography or through photographic processes. Informed by narratives of daily experience, intimate interactions, and relationships that accumulate and evolve over time, the artists trace overlapping encounters between places and people—the signs, symbols, and private languages that develop through periods of coexistence. Notions of self expand to involve not only the exhibiting artists, but their communities and the locations they frequent, including the gallery itself and surrounding neighbourhood. The works reference collaboration as a methodology, nurtured by a long-term commitment to knowing ourselves, one another and all that is around us.`),

P('a-distance-a-heart-felt',{
  title:'a distance, a heart felt', year:'2022', kind:'Solo exhibition', venue:'Duplex Artist Society',
  thumb:'2022/04/6FBC906F-7DA0-4372-929D-B8821FA3115D-scaled.jpg',
  hero:img('2022/06/91D65BEF-D3BA-4B08-98EC-8569BB99E656-2048x1367.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
  meta:['Eric Tkacyzk','Curated by Andrea Valentine-Lewis','Duplex Artist Society, Vancouver, BC','May 6 – May 25, 2022'],
  blocks:[
    poem(['Blood rises to the surface of the skin','Blush, for a pinkish powder to replicate','Where there is a deficiency, there is a vice','A filter for you to flow through','Piercing a hole for a gem to nestle','Socks for your whole body.','A comfort in stillness','For once, a barren calm','When can I come home,','To the house amidst the vast, flat fields?','The one that is located far from the others','The one that taught me about distance','And how it soothes.']),
    rule,
    p(`a distance, a heart felt presents painted works by Eric Tkacyzk from the past few years that reflect the artist’s desire to understand the complexity and performative expressions of gender and identity. In his 2021 series Stockings Run Through Potpourri, tight-woven, beige nylon is pulled taut across a row of nails revealing a surface for negotiation – where tender stiches repair gaping holes and dried rose petals balance the violent scarring imposed on the fabric. Between the raw wood frames, we are privy to witness a harmonious bareness – a composition with its own personal boundaries that reveals as much as it can within its own comfort.`),
    p(`His 2019 series of paintings are also composed on the surface of taut nylon that the artist has used to envelope wood frames; the translucency of the springy fabric exposes the frames – an aura of a shadowy presence assuming a position in the margins. Upon the nylon, Tkaczyk renders what appears like chalky purple bruises and sketches in coral lipstick that ooze a thin oil like the residue produced by expired makeup. The gentle playfulness of each gesture on the nylon gives it a transient, in-progress quality mirroring his own ongoing mediation with identity.`),
    p(`Consistent in Tkaczyk’s work across disciplines including digital performance, installation, and painting, is a demonstration of the artist’s seemingly composed posture while exploring themes around disembodiment, fragmentation, and transience through queer sensibilities. While these explorations can be cathartic, devastating, and difficult, Tkaczyk manages to make work that appears so elegant and controlled – a palpable tension.`),
    p(`For this exhibition, we created a special environment using colour and light to facilitate a space for you to explore your own sentimentalities that may emerge with the work.`),
    rule,
    img('2022/06/3F647D7E-4AD6-4D81-8CD2-599160739D78-2-scaled.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
    img('2022/06/4E08DE32-648D-4660-89F7-0A87446B1D1D-scaled.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
    img('2022/06/1C45B6CD-CFA2-4382-A50C-B6F3A5DDF6B5-2048x1367.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
    img('2022/06/32D5C94E-B1D1-416D-A668-980E38FA8573-scaled.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view.'),
    img('2022/06/6FBC906F-7DA0-4372-929D-B8821FA3115D-2048x1367.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
    img('2022/06/2935D0D0-2263-4271-B4FD-C4AA3211C9EE-2048x1367.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
    img('2022/06/C4B21FB9-BDB7-43C9-83EB-4FB997D54A34-2048x1367.jpg','Eric Tkaczyk, a distance, a heart felt, 2022, installation view. Photo by Khim Hipol.'),
    p(`Eric Tkacyk (he/him) is an interdisciplinary, multimedia artist who lives and practices on the ancestral and unceded territories of the xʷməθkʷəy̓ əm (Musqueam), sḵwx̱wú7mesh (Squamish) and səl̓ilwətaɁɬ (Tsleil-waututh) First Nations. Recent solo exhibitions include /ˈsent(ə)nəl/ at Burrard Arts Foundation’s Garage in Vancouver, BC (2021-22) and Goneness at Ground Floor Art Centre in Vancouver (2019). Selected exhibitions include beyond the scrim at the Mount Pleasant Community Art Screen (2022), all this time at Number 3 Gallery, online (2020), Graduation Exhibition at Emily Carr University of Art + Design (2020), and Ritual Union at the RBC Media Gallery at Emily Carr (2020). Tkaczyk’s work /ˈsent(ə)nəl/ was featured in an article by Clara Dubber in Discorder Magazine (2022). He holds a Bachelor of Fine Arts from Emily Carr University of Art + Design (2020). He is also a board member at Duplex Artist Society.`)
  ]}),
P('crudites',{
  title:'Crudités', year:'2022', kind:'Solo presentation', venue:'Capture Photography Festival',
  thumb:'2022/02/4_Web_MarineDr_STergesen_Capure2022-2400x1553-1.jpeg',
  hero:img('2022/06/DSC4416.jpg','Svava Tergesen at Marine Drive Station.'),
  meta:['Svava Tergesen','Curated by Andrea Valentine-Lewis','Capture Photography Festival – Marine Drive Station','April 1 – August 31, 2022'],
  blocks:[
    p(`In the fall of 2019, illness caused artist Svava Tergesen to lose her appetite. Though the thought of consuming foods in her fridge repulsed the artist, she wanted to engage with the materiality of fruits through touch and sight, rather than taste. For her series Crudités, Tergesen began composing surreal ornamental arrangements using the citrus fruits, melons, pears, and squash she sourced locally, including at Marine Drive’s T&amp;T Supermarket. No longer needing to account for appropriate ripeness, texture, bruising, and other considerations associated with food consumption, Tergesen selected fruits as if they were the coloured glass or pigments used in the creation of a stained-glass window. The artist’s saturated colour palette, domestic textiles, and unusually flat lighting are reminiscent of some of the uncanny food photography of the 1950s and ‘60s found in magazines and on recipe cards. In Tergesen’s work, manipulating food becomes a playful and aesthetic gesture, rather than a task focused on nurturing the family, offering resistance to or a reimagining of domestic tasks within the household.`),
    p(`For Tergesen, her large format camera and analog film act as plastic wrap, preserving the precarious arrangements and halting the inevitable process of decomposition that food faces. Her camera is also utilized as a bridge between photography and sculpture and between photography and disciplines that are typically referred to as “craft”, such as quilting, crocheting, and even cooking.`),
    p(`<span class="mono">Presented in partnership with Burrard Arts Foundation and the Canada Line Public Art Program – InTransit BC</span>`),
    img('2022/04/IMG_6067-1.jpg','Andrea Valentine-Lewis at Marine Drive Station, 2022.'),
    img('2022/06/DSC3761_V1.jpg','Svava Tergesen at Marine Drive Station.'),
    img('2022/06/DSC3782.jpg','Svava Tergesen at Marine Drive Station.'),
    img('2022/06/DSC3776.jpg','Svava Tergesen, Prosciutto and Melon, 2019, from Crudités series.'),
    img('2022/06/DSC3779.jpg','Svava Tergesen, Bluebells, 2019, from Crudités series.'),
    img('2022/06/DSC3780.jpg','Svava Tergesen, Platter (Blue and Green Honeydew), 2019, from Crudités series.'),
    img('2022/06/OrangeV2.jpg','Svava Tergesen, Surprise, 2019, from Crudités series.'),
    p(`Svava Tergesen (she/her) is an interdisciplinary artist currently living and working on the unceded territories of the Squamish, Musqueam, and Tsleil-Waututh Nations (colonially known as Vancouver, BC, Canada). Recent solo exhibitions include Garnished Sundries at Telephone Gallery in Vancouver, BC (2022). Selected group exhibitions include VGH &amp; UBC Hospital Foundation Art Collection at Trapp Projects in Vancouver, BC (2022), The Big Camera Show at the University of Iowa (2022), Open Studios Group Show at the Banff Centre (2022), To Stay Related at Nextdoor Gallery in Vancouver, BC (2021), Discovery at Seymour Art Gallery in North Vancouver (2021), and The Lind Prize at The Polygon Gallery in North Vancouver (2020). In 2021, Tergesen held a Visual Art Residency at the Banff Centre for the Arts and Creativity. She was shortlisted for a PENN Idea Art Award (2022), longlisted for a Critical Mass Finalist (2021), longlisted for a New Generation Photography Award (2021), shortlisted for a Philip B. Lind Emerging Artist Prize (2020), and listed as a Top 25 to Watch with Lenscratch (2020). Tergesen holds a BFA in Photography from Emily Carr University of Art + Design (2020) and a BA in Mathematics from McGill University (2016).`)
  ]}),
P('future-relics-of-our-time',{
  title:'future relics of our time', year:'2022', kind:'Group Exhibition', venue:'Equinox Gallery',
  thumb:'2022/01/05_SerisaFitzJames_ButterflyPot-scaled.jpg',
  meta:['Serisa Fitz-James, Jack Kenna, and Isabel Wynn','Curated by Andrea Valentine-Lewis','Equinox Gallery, Vancouver, BC','February 19 – March 19 2022'],
  blocks:[
    img('2021/09/serisa.pot1_.jpg','Serisa Fitz-James, Super Football, 2021, coloured clay, 18 x 18 x 18.'),
    p(`Equinox Gallery is pleased to present ${L('https://www.equinoxgallery.com/exhibitions/serisa-fitz-james-jack-kenna-isabel-wynn-curated-by-andrea-valentine-lewisfuture-relics-of-our-time/','future relics of our time')}, an exhibition of ceramic works by Serisa Fitz-James, Jack Kenna, and Isabel Wynn, curated by Andrea Valentine Lewis. During the Middle Ages, objects associated with holy people and sites were deeply celebrated. Due to their association with saints or with heaven itself, relics, such as bits of hair or body parts, were considered divine. Because the term relic derives from the Latin word relinquere, meaning “that which is left behind,” these objects have become temporal markers for future generations. Reflecting on the material and affective dimensions of Medieval relics, one might wonder, what would constitute a future relic representative of our present time.`),
    img('2022/02/29010.jpg','Isabel Wynn, Becoming Fluid, 2022, ceramic, 14 x 15 x 12 inches.'),
    p(`The ceramic works by Fitz-James, Kenna, and Wynn concretize a resonant dimension relating to our current–and precarious—social, political, and environmental climate. In its raw state, clay is impressionable and pliant, but once placed in the kiln, it is susceptible to disobedience. Ceramic artists are accustomed to the element of chance inherent in the firing process, and a cracked or caved-in result is typically viewed as unfit for presentation. Rather than disguising such flaws and rejecting the ‘disorderly’ qualities of clay, the works included in this exhibition embrace the negative chance effects of the material to convey both humour and melancholia. Such an acceptance of instability and volatility is in fact a valuable recognition of precarity and the inability to control everything, an attitude that is essential to navigate our changing planet this year, next year, and beyond.`),
    img('2022/02/29031.jpg','Jack Kenna, Milk Maid, 2022, glazed stoneware, 14 x 14 x 11.5 inches.'),
    {t:'break'},
    img('2022/04/DSC09783-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC09813-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC09792-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC09777-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC00114-scaled.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC00104-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC00135-1-2048x1536.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC00110-2-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC09786-2048x1365.jpeg','future relics of our time, 2022, installation view.'),
    img('2022/04/DSC09761-1754x2048.jpeg','future relics of our time, 2022, installation view.'),
    rule,
    p(`Serisa Fitz-James (they/them) is a Filipinx-Canadian interdisciplinary artist living and working in Vancouver. Recent exhibitions include a solo presentation at Libby Leshgold Gallery in Vancouver (2022) and in a group exhibition at the Mitchell Art Gallery at MacEwan University in Edmonton (2022). In 2021, Fitz-James was selected as Port Moody Art Centre’s ceramic artist-in-residence, developing a solo exhibition We Can Ask for More (2021). Recent group exhibitions include Earthbound at Lipont Gallery in Richmond (2021), August Studios (2021), and In Over Our Heads at Franc Gallery in Vancouver (2020). Fitz-James holds a BFA from Emily Carr University of Art + Design (2020).`),
    p(`Jack Kenna (he/him) is a multi-disciplinary artist living and working in Vancouver. Recent solo exhibitions include Tumbling Blocks at Burrard Arts Foundation, A Clog in the Machine at The Alternator Centre for Contemporary Art in Kelowna (2020), Gridworks (2020) and Dairyland (2019) both at Slice of Life Gallery in Vancouver. Select group exhibitions include I Like to Look at Curve Line Space in Los Angeles (2020), In Over Our Heads at Franc Gallery in Vancouver (2020), and Got it for Cheap at 0.0 Gallery in Los Angeles (2018). Kenna has participated in residencies including at Burrard Arts Foundation (2022) and in the Bonnie McComb Kreye Residency in Victoria (2021). Kenna holds a BFA from Emily Carr University of Art + Design. Kenna is represented by Equinox Gallery.`),
    p(`Isabel Wynn (she/her) is a Brazilian-Canadian ceramic artist living and working in Vancouver, where she is also the founder of Báhoo Studios, a school focusing on ceramics Wynn’s work was recently presented in collaboration with Demure Creative House (2021), and in a group show at TAS Vancouver (2021). Selected group exhibitions include Earthbound at Lipont Gallery in Richmond (2021), Slice of Life Gallery in Vancouver (2021), and August Studios (2021). In 2022, Wynn will present a collaborative work involving ceramic works and projected moving image with interdisciplinary artist Rodrigo Gares. Wynn holds a BFA from Emily Carr University of Art + Design.`)
  ]}),
P('utopos',{
  title:'UTOPOS', year:'2020', kind:'Two-person exhibition', venue:'Deluge Contemporary Art',
  thumb:'2020/11/IMG_9651-scaled-e1606437221757.jpg',
  meta:['Alex Tedlie-Stursberg and Callum Monteith','Curated by Andrea Valentine-Lewis','Deluge Contemporary Art, Victoria BC','September 11 – October 10, 2020'],
  blocks:[
    img('2020/11/IMG_9588-scaled.jpg','Installation view.'),
    links([L('https://drive.google.com/file/d/1_rifCVjTkbiGMdxpxxuInZ4B_ffs8Hxn/view','Link to exhibition essay')]),
    p(`The title for this exhibition is taken from the Greek term, Ou-topos;Ou (not) and Topos (a place). The term Utopos holds two other meanings: the first being “the good place” and the second “the place that cannot be.” In the Talking Heads song “Nothing but Flowers,” David Byrne’s lyrics follow a similar path by embodying this shared meaning of Utopos, where yes, the grass really is greener on the other side of the fence, but, upon reflection, neither greens—nor grass for that matter—are all they were cracked up to be. Be careful what you wish for. You might get it and regret it.`),
    p(`The notion of a Utopia, a perfect community or civilization designed for perfection and autonomy can only, in essence, exist in the imagination or conceptually. It is by humankind’s very existence that renders the reality of this endeavour impossible. Yet, it is a concept that is constantly strived for, as is evident within the current socio-political climate, and with trends of populism, nationalism and retrenchment. The paradox is that while striving for this idealistic model of a Utopia, humans actually move closer to that of the antonym of this condition in Dystopia—a community or society that is undesirable or frightening.`),
    /* TODO: the original page quotes a short excerpt of the song lyrics here — paste it back in as poem([...]) */
    rule,
    img('2020/11/IMG_9651-768x1024.jpg','Installation view.'),
    p(`For this exhibition, Callum Monteith and Alex Tedlie-Stursberg presented a new body of work that considers the contradictory nature of the term Utopos. Through the development of their shared research interests including the relationship between humans and nature, explorations into artificiality, manicuring of environments and abstracted or absurd artistic gestures, Monteith and Stursberg challenge the conditions of Utopia. Their research has advanced through an open and wide-ranging dialogue between the artists that looks to many topics for inspiration, including pop-culture, sociological/philosophical studies, art history and fictional narratives.`),
    img('2020/11/utopos-10-2048x1427.jpg','Installation view. Photo by Todd Eacrett.'),
    img('2020/11/utopos-07-2048x1407.jpg','Alex Tedlie-Stursberg, Float (Half Sphere), 2020, aluminum, infused mist, 20.32 cm x 20.34 cm x 10.16 cm. Photo by Todd Eacrett.'),
    p(`Callum Monteith (b. 1988) lives and works in Glasgow, Scotland, where he works in painting, photography and printmaking. Monteith’s practice interweaves notions of nature, philosophy and aesthetics with a particular interest in how we construct our ideas of self through fictions of alternative places or imagined landscapes. Recent exhibitions include solo exhibitions Shelf Show #3 at Cockburn Street, Edinburgh, PARADISAL at The Briggait, Glasgow and PLANT ROOM, a group exhibition at Hanson Street Project Space, also in Glasgow (2019).`),
    p(`Alex Tedlie-Stursberg (b.1980) lives and works in Vancouver, BC, where he is a multidisciplinary artist with a key focus on sculpture and installation. His work has been exhibited in numerous galleries across North America and Europe; recent exhibitions include Sous La Plage / Les Pavés at Trapp Projects, Vancouver (2021), MASS RESIDUE with Field Contemporary and SUPER, NATURAL, a group exhibition at Unit 17, Vancouver (2019), Holy Wave as part of Glasgow International, Scotland and Everything Flows with Burrard Art Foundation, Vancouver (2018). Stursberg is currently employed as a Sessional Instructor at Langara College Visual Arts Program. He is currently developing public artworks for Ballard Fine Art in Vancouver.`)
  ]}),
P('greenpiece',{
  title:'Green Piece', year:'2019', kind:'Solo exhibition', venue:'Unit 17',
  thumb:'2020/11/01BlackMedicandFoxtailBarleyPINK-e1606266095946.jpg',
  meta:['Andrew Dadson','Curated By Andrea Valentine-Lewis','Unit 17, Vancouver BC','September 28 – November 20, 2019'],
  blocks:[
    img('2020/11/01BlackMedicandFoxtailBarleyPINK-1-960x1024.jpg','Andrew Dadson, Black Medic and Foxtail Barley (Medicago lupulina and Hordeum jubatum) Pink, 2019, wild clover, barley, milk paint (water, casein, chalk, limestone, earth pigments, cochineal). Inkjet print mounted on Di-bond. 150 x 190 cm (framed).'),
    links([L('https://www.unit17.org/andrew-dadson','Link to exhibition details'),L('https://ca980a5b-055c-4d64-bd5d-666b109bdc3d.filesusr.com/ugd/813186_63696f900b3d4ebaa63e4b6883014668.pdf','Link to exhibition essay'),L('https://ca980a5b-055c-4d64-bd5d-666b109bdc3d.filesusr.com/ugd/813186_393d4ea2873041a89983bbc8104d7ea0.pdf','Link to installation views')]),
    p(`A solo exhibition of never before seen photographs by Andrew Dadson. This work was created over the summer of 2019 throughout an empty lot within the 2950 block of West 4th Avenue in Vancouver. This site, the former location of a chain restaurant, is currently a transient space where unplanted plant species flourish and temporarily encourage new ecosystems.`),
    p(`Green Piece consists of several inkjet prints mounted on Di-bond that document the artist’s painting at this specific site. These works are initiated by physically marking the lot with biodegradable earth pigments of no more than a few inches. Highly detailed images are then stitched together of various grasses, clovers and thistles, among other plants.`),
    p(`Dadson has often used the act of painting to critique and reflect upon the marks, both insignificant and catastrophic, that humans leave upon the environment and use to communicate. Unlike some of the artist’s previous painted landscapes that have focused on larger surface areas, Green Piece closely articulates distinctive traits of the individual plant species that have persevered through the site’s many shifts. Each work becomes its own jungly terrain of intertwined stems, leaves, buds and fibers.`),
    img('2020/11/04RedCloverBLUE.jpg','Andrew Dadson, Red Clover (Trifolium pratense) Blue, 2019, wild clover, milk paint (water, casein, chalk, limestone, earth pigments). Inkjet print mounted on Di-bond. 184 x 134 cm (framed).'),
    p(`Contrasting his previous application of exclusively black or white pigments to highlight various sites, Green Piece introduces coloured pigments made with ingredients such as cochineal, ochre and indigo. In the large-scale work Black Medic and Foxtail Barley (Medicago lupulina and Hordeum jubatum) Pink, the unplanted species from the clover family is painted in a vibrant pink pigment. Within the outer perimeter of the image, unpainted sections of yellow flowers with rounded leaves and dried grasses stretch into the centre of the inner painted image. Dadson’s use of pigment against this shifting and fading landscape expands his interest in notions of framing and the changing nature of space in the face of time.`),
    p(`The works in Green Piece highlight a temporal space for unplanted species and their short-lived existence within “in-between” sites. They consider the conditioning of land and histories of species categorization.`),
    img('2020/11/Screen-Shot-2020-11-24-at-4.36.27-PM.png','Installation view.'),
    img('2020/11/Screen-Shot-2020-11-24-at-4.36.52-PM.png','Installation view.'),
    p(`Andrew Dadson (b. 1980) graduated from Emily Carr University of Art + Design in 2003 and currently lives and works in Vancouver. Dadson has exhibited widely in solo and group exhibitions. Most recently at Daniel Faria Gallery (2019) in Toronto, 313 Art Project (2019) in Seoul, Contemporary Art Gallery (2017), Polygon Gallery, both Vancouver (2017), Galleria Franco Noero, Turin (2017) and as part of Parcours, Art Basel (2016). Dadson has upcoming solo exhibitions in Seoul, South Korea and Toronto, Canada (both 2019) and is currently a finalist for the Artisti per Frescobaldi Art Prize 2020 held in Tuscany, Italy.`)
  ]})
];

 gallery:[
  {org:'Vancouver Art Gallery', roles:['Curatorial Assistant – Oct 2022 – present'],
   desc:`Researching and gathering information for upcoming exhibitions; writing extended label copy; writing for exhibition publication and catalogues; project managing and liaising between Gallery-wide departments; organizing touring exhibitions; attending studio visits; acquisitions support; preparing loan letters, contracts, and agreements; and working with databases and softwares including Sketchup, STAR, Axiell, FileMaker Pro, and Raiser’s Edge.`,
   intro:'Curatorial Assistant on the following projects:',
   projects:[
    [L(VAG+'future-geographies/','Future Geographies: Art in the Century of Climate Change'),'upcoming, May 14, 2026 to January 10, 2027',
     [`curated by Eva Respini, Interim Co-CEO &amp; Curator at Large. Featuring works from the past 25 years, this exhibition underscores the urgency and relevance of sustainability and the environment as defining issues of our time. More than 35 works across a range of media—from large-scale video installations to living sculptures—invite viewers to confront pressing questions about our shared future on this planet.`,
      `Presented across multiple floors, Future Geographies includes a newly commissioned work by Jeffrey Gibson and marks the first time several artists are exhibiting in Vancouver, including Teresita Fernández, Josh Kline, Cannupa Hanska Luger, Jean Shin and Clarissa Tossin. The exhibition also features major works by BC–based artists such as Brian Jungen, Gabrielle L’Hirondelle Hill and Lawrence Paul Yuxweluptun Lets’lo:tseltun, connecting global issues with local specificity. Together, the works in this exhibition invite dialogue and create space for imagining.`]],
    [L(VAG+'written-in-clay/','Written in Clay: From the John David Lawrence Collection'),'May 25, 2025 to January 4, 2026',
     [`curated by Diana Freundl, Senior Curator, Michael J. Prokopow, Independent Curator, and Stephanie Rebick, Interim Director of Exhibitions &amp; Publishing. Written in Clay presents a history of ceramics made in British Columbia told through the collection of John David Lawrence. Featuring approximately 200 objects, it examines the materials and processes artists utilized in relation to the context in which studio ceramics arose and developed in the region. In this exhibition, I was a contributing writer for the catalogue ${L(SHOP_LAWRENCE,'The Place of Objects: The John David Lawrence Collection')}.`]],
    [L(VAG+'postcards-from-the-heart','Postcards from the Heart: Selections from the Brigitte and Henning Freybe Collection'),'Apr 18, 2025 to Oct 5, 2025',
     [`curated by Eva Respini, Interim Co-CEO &amp; Curator at Large. The exhibition celebrates the Freybes’ contributions as patrons of the arts, collectors and longtime supporters of the Vancouver Art Gallery. Comprising a selection of more than 30 paintings, sculptures, photographs, films and works on paper, Postcards from the Heart is a tribute to the couple’s deep engagement with modern and contemporary art and reflects the depth of the Freybes’ collecting with works from the 1960s to today.`]],
    [L(VAG+'firelei-baez','Firelei Báez'),'Nov 2, 2024 to Mar 23, 2025',
     [`curated by Eva Respini, Interim Co-CEO &amp; Curator at Large. One of the most exciting painters of her generation, Báez delves into the historical narratives of the Atlantic Basin. Over the past fifteen years, she has made work that explores the multilayered explorations of the legacy of colonial histories and the African diaspora in the Caribbean and beyond. She draws on the disciplines of anthropology, geography, folklore, fantasy, science fiction and social history to unsettle categories of race, gender and nationality in her paintings, drawings and installations.`]],
    [L(VAG+'rootedhere','Rooted Here: Woven from the Land'),'Dec 16, 2023 to May 12, 2024',
     [`curated by Richard Hill, Smith Jarislowsky Senior Curator of Canadian Art, celebrates the work of four prominent local Salish weavers: qʷənat, Angela George (səlilwətaɬ/Tsleil-Waututh); Chepximiya Siyam’ Chief Janice George (Sḵwx̱wú7mesh/Squamish); Skwetsimeltxw Willard “Buddy” Joseph (Sḵwx̱wú7mesh/Squamish); and Qwasen, Debra Sparrow (xʷməθkʷəy̓əm/Musqueam).`]],
    [L(VAG+'jeh-macdonald-tangled-garden','J.E.H. MacDonald? A Tangled Garden'),'Dec 16, 2023 to May 12, 2024',
     [`curated by Richard Hill, Smith Jarislowsky Senior Curator of Canadian Art. In 2015, the Vancouver Art Gallery announced the acquisition of ten previously unknown painted sketches attributed to J.E.H. MacDonald, one of Canada’s most celebrated painters and a founding member of the Group of Seven. Soon after, experts in the wider arts community began to publicly raise questions about the authenticity of the ten works. The exhibition not only provides an answer regarding whether the ten sketches can be attributed to MacDonald, but also allows visitors a rare and detailed look into how that conclusion was reached.`]],
    [L(VAG+'conceptionsofwhite','Conceptions of White'),'Sept 9, 2023 to Feb 4, 2024',
     [`curated by John G. Hampton (Mackenzie Art Gallery) and Lillian O’Brien Davis (Art Gallery of York University), coordinated at Vancouver Art Gallery by Mandy Ginson, former Associate Curator. Conceptions of White is an exhibition offering context and nuanced perspectives that help viewers grapple with contemporary configurations of White identity. The exhibition examines the origins, travel and present reality of “Whiteness” as a concept and a racial invention that classifies degrees of civility/humanity.`]],
    [L(VAG+'fashion-fictions','Fashion Fictions'),'May 27, 2023 to Oct 9, 2023',
     [`curated by Stephanie Rebick, Interim Director of Exhibitions &amp; Publications, with contributing curators Amber-Dawn Bear robe and Siobhan McCracken Nixon. Fashion Fictions surveyed experimental design practices that exist at the intersection of fashion and other modes of cultural production. International in scope, the exhibition explored the increasing influence of research-based, materially driven practices on the global fashion scene, while acknowledging the proliferation of creative practices that challenge the aesthetic, material and technological conventions of fashion. In this exhibition, I was a contributing writer for the catalogue of the same name, see ${L(SHOP_FF,'here')}.`]],
    [L(VAG+'hardedge','Hard-Edge'),'Mar 4, 2023 to June 4, 2023',
     [`curated by Richard Hill, Smith Jarislowsky Senior Curator of Canadian Art, showcased a selection of hard-edge abstract paintings from the 1960s and 70s. The exhibition drew from the Vancouver Art Gallery’s permanent collection, featuring iconic works by artists such as Jack Bush, Roy Kiyooka, Guido Molinari, Frank Stella, Takao Tanabe and Joan Balzar, some of which were xhibited at the Gallery for the first time since their acquisition.`]]
   ]},
  {org:'Burrard Arts Foundation; Vancouver, BC', roles:['Interim Director (mat leave contract) – Oct 2021 – Oct 2022','Gallery Coordinator – May – Oct 2021'],

/* One project at a time: wheel, arrow keys, a swipe, or clicking a show steps through the list, which
   slides so the current row stays on the line; its details fade in and its image unrolls down from it.
   Hovering never moves anything. Clicking the current show opens it. Remembers where you were. */
function setupCx(){
  const root = $('#cx', main); if(!root) return;
  const rows = $$('.cx-list a', root), list = $('#cxList', root), n = rows.length;
  let cur = -1, last = 0, acc = 0;
  const set = i => {
    i = Math.max(0, Math.min(n-1, i)); if(i === cur) return;
    if(cur >= 0) root.classList.add('moved');
    cur = i;
    $$('[data-i]', root).forEach(el=>{
      const d = Math.abs(+el.dataset.i - i);
      el.classList.toggle('on', d===0);
      el.classList.toggle('n1', d===1); el.classList.toggle('n2', d===2);
      el.classList.toggle('after', +el.dataset.i > i);
      const img = el.classList.contains('cx-im') && d<=1 && $('img', el);
      if(img && !img.src) img.src = img.dataset.src;           // load the current image and its neighbours
    });
    const r = rows[i]; list.style.transform = `translateY(${-(r.offsetTop + r.offsetHeight/2)}px)`;
  };
  const step = d => { const now = performance.now(); if(now - last < 380) return; last = now; set(cur + d) };
  const onWheel = e => { e.preventDefault(); acc += e.deltaY; if(Math.abs(acc) > 30){ step(Math.sign(acc)); acc = 0 } };
  const onKey = e => {
    if(['ArrowDown','PageDown','j'].includes(e.key)){ e.preventDefault(); set(cur+1) }
    else if(['ArrowUp','PageUp','k'].includes(e.key)){ e.preventDefault(); set(cur-1) }
    else if(e.key==='Enter' && !e.target.closest('a')) location.hash = rows[cur].getAttribute('href');
  };
  let ty = null;
  const onTouchStart = e => { ty = e.touches[0].clientY };
  const onTouchEnd = e => { if(ty===null) return; const dy = ty - e.changedTouches[0].clientY; if(Math.abs(dy) > 36) set(cur + Math.sign(dy)); ty = null };
  root.addEventListener('wheel', onWheel, {passive:false});
  root.addEventListener('touchstart', onTouchStart, {passive:true});
  root.addEventListener('touchend', onTouchEnd);
  addEventListener('keydown', onKey);
  rows.forEach(a=>{
    a.addEventListener('click', e=>{ if(+a.dataset.i !== cur){ e.preventDefault(); set(+a.dataset.i) } });  // first click selects, second opens
    a.addEventListener('focus', ()=>{ if(a.matches(':focus-visible')) set(+a.dataset.i) });   // keyboard only
  });
  const pics = $('.cx-pics', root);
  pics.addEventListener('click', e=>{ if(e.target.closest('.cx-im.on')) location.hash = rows[cur].getAttribute('href') });
  pics.addEventListener('mouseover', e=>root.classList.toggle('pic', !!e.target.closest('.cx-im.on')));
  pics.addEventListener('mouseout', ()=>root.classList.remove('pic'));
  // back from an exhibition's page (Index link, browser back): land on that exhibition; from the nav or anywhere else: the newest
  set(!viaNav && cameFrom && cameFrom.name==='project' ? Math.max(0, PROJECTS.findIndex(x=>x.slug===cameFrom.slug)) : 0);
  hydrate.cleanup = () => removeEventListener('keydown', onKey);
}

const MONTH = /\b(Jan|Feb|Mar|Apr|May|June?|July?|Aug|Sept?|Oct|Nov|Dec)(uary|ruary|ch|il|ust|tember|ober|ember)?\b\.?/;
const isDate = s => MONTH.test(s) && /^[A-Za-z]+\.?(\s\d{1,2})?(,?\s\d{4})?$/.test(s.trim());

function years(s){
  if(!MONTH.test(s)) return s.trim();
  const y = [...new Set(s.match(/\b(?:19|20)\d{2}\b/g) || [])];
  if(/present/i.test(s)) return `${y[0]||''} – present`;
  return y.length > 1 ? `${y[0]} – ${y[y.length-1]}` : (y[0] || '');
}

  const sec = (title, body) => `<section class="cvs"><h2>${title}</h2><div class="rows">${body}</div></section>`;
  const gallery = CV.gallery.map(g=>{

    const ys = roles.flatMap(r=>r.when.match(/\d{4}/g)||[]).map(Number);
    const span = roles.some(r=>/present/.test(r.when)) ? `${Math.min(...ys)} – present` : (Math.min(...ys)===Math.max(...ys) ? `${ys[0]}` : `${Math.min(...ys)} – ${Math.max(...ys)}`);
    let out = row(span, `<details class="job"><summary>${g.org}<span class="pm"></span>${roles.map(r=>`<div class="rl">${r.title}${roles.length>1?`, ${r.when}`:''}</div>`).join('')}</summary><p class="d">${g.desc}</p></details>`);

/* ---------------- NAME: each letter morphs from block to hand-drawn near the pointer ----------------
   Outlines come from name-glyphs.js (build_name.py): every contour exists in an Archivo and a
   Pinyon Script (cursive) version with the same number of points, so a letter is just interpolated numbers. */
function NameMorph(root){
  const G = window.NAME_GLYPHS; if(!G) return null;
  let top = 0, bot = 0;
  for(const g of Object.values(G.glyphs)) for(const c of g.s)   // line height from the block font; the scribble may spill
    for(let k=1;k<c.length;k+=2){ if(c[k]>top) top=c[k]; if(c[k]<bot) bot=c[k] }
  const H = top - bot, ease = t => t*t*(3-2*t);
  let lines = [], glyphs = [], fs = 100, raf = 0;
  const ptr = {x:-1e5, y:-1e5};

  function shape(ch, e){
    const g = G.glyphs[ch]; let d = '';
    for(let i=0;i<g.s.length;i++){
      const S = g.s[i], F = g.f[i];
      for(let k=0;k<S.length;k+=2) d += (k?'L':'M') + (S[k]+(F[k]-S[k])*e).toFixed(1) + ' ' + (-(S[k+1]+(F[k+1]-S[k+1])*e)).toFixed(1);
      d += 'Z';
    }
    return d;
  }
  function build(spec){
    $$('svg', root).forEach(s=>s.remove()); lines = []; glyphs = [];
    for(const toks of spec){
      const svg = document.createElementNS(NS,'svg'); svg.setAttribute('aria-hidden','true');
      const L = {svg, gl:[], w:0};
      for(const tok of toks) for(const [ch,as,af] of G.tokens[tok]){
        const p = document.createElementNS(NS,'path'); svg.appendChild(p);
        const o = {ch, as, af, t:0, e:-1, x:0, p, from:0, hold:0}; L.gl.push(o); glyphs.push(o);
      }
      root.appendChild(svg); lines.push(L);
    }
    root.classList.add('ready'); render(true);
  }
  function render(force){
    for(const L of lines){
      let x = 0, moved = force;
      for(const o of L.gl){
        const e = ease(o.t);
        if(force || Math.abs(e-o.e) > .002){ o.e = e; o.p.setAttribute('d', shape(o.ch, e)); moved = true }
        o.x = x; x += o.as + (o.af-o.as)*o.e;
      }
      if(!moved) continue;
      for(const o of L.gl) o.p.setAttribute('transform', `translate(${o.x.toFixed(1)} 0)`);
      L.w = x;
      L.svg.setAttribute('viewBox', `0 ${-top} ${x.toFixed(1)} ${H}`);
      L.svg.style.width = (x/1000)+'em'; L.svg.style.height = (H/1000)+'em';
    }
  }
  function frame(now){
    const R = fs*1.3;
    for(const L of lines){
      const r = L.svg.getBoundingClientRect(), k = r.width / L.w, cy = r.top + r.height*.55;
      for(const o of L.gl){
        const cx = r.left + (o.x + (o.as+(o.af-o.as)*o.e)/2) * k;
        // fully hand-drawn under the pointer, fading out over about a letter and a half
        let tgt = Math.min(1, Math.max(0, (1 - Math.hypot(ptr.x-cx, ptr.y-cy) / R) * 2));
        if(now > o.from && now < o.hold) tgt = 1;
        o.t += (tgt-o.t) * (tgt > o.t ? .16 : .035);       // bloom quickly, relax slowly
        if(Math.abs(tgt-o.t) < .001) o.t = tgt;
      }
    }
    render(false);
    raf = requestAnimationFrame(frame);
  }
  const onMove = e => { ptr.x = e.clientX; ptr.y = e.clientY };
  const onLeave = () => { ptr.x = ptr.y = -1e5 };
  const onDown = e => {             // touch: a tap sends a scribble through the name
    if(e.pointerType === 'mouse') return;
    const now = performance.now();
    glyphs.forEach((o,i)=>{ o.from = now + i*45; o.hold = o.from + 650 });
  };
  addEventListener('pointermove', onMove, {passive:true});
  document.addEventListener('mouseleave', onLeave);
  root.addEventListener('pointerdown', onDown);
  raf = requestAnimationFrame(frame);
  return {
    build, lines:()=>lines, H:()=>H/1000,
    setSize(px){ fs = px; root.style.fontSize = px+'px' },
    destroy(){ cancelAnimationFrame(raf); removeEventListener('pointermove', onMove); document.removeEventListener('mouseleave', onLeave) }
  };
}

const narrow = matchMedia('(max-width:820px)');
function setupName(){
  const el = $('#name', main); if(!el) return;
  morph = NameMorph(el); if(!morph) return;
  const fit = () => {
    morph.build(narrow.matches ? [['Andrea'],['Valentine-'],['Lewis']] : [['Andrea'],['Valentine-','Lewis']]);
    // em; whichever is wider, all-block or all-scribble, so a hovered line never runs off the edge
    const widest = Math.max(...morph.lines().map(L=>Math.max(L.w, L.gl.reduce((a,o)=>a+o.af, 0)))) / 1000;
    const byWidth = el.clientWidth / widest;
    if(narrow.matches){ morph.setSize(byWidth); return }
    // desktop: as big as the width allows, unless that would push the page into a scroll
    const home = el.parentElement, cs = getComputedStyle(home);
    const used = Math.max(...$$('.bio,.portrait', home).map(x=>x.getBoundingClientRect().bottom)) - home.getBoundingClientRect().top;
    const room = home.clientHeight - used - parseFloat(cs.paddingBottom) - 28;
    const n = morph.lines().length, byHeight = room / (n*morph.H() + (n-1)*.05);
    morph.setSize(Math.max(Math.min(byWidth, byHeight), byWidth*.6));
  };
  fit();
  hydrate.onResize = fit;
}

/* ---------------- ROUTER ---------------- */
const main = $('#main');
function parse(){
  const [a,b] = location.hash.replace(/^#\/?/,'').replace(/\/$/,'').split('/');
  if(a==='curatorial' && b) return {name:'project', slug:b};
  if(['curatorial','writing','cv','contact'].includes(a)) return {name:a};
  return {name:'home'};
}
const LABEL = {curatorial:'Curatorial', writing:'Writing', cv:'CV', contact:'Contact'};
$$('[data-nav]').forEach(a=>a.textContent = LABEL[a.dataset.nav]);
function viewFor(r){
  if(r.name==='project') return viewProject(r.slug);
  return ({home:viewHome, curatorial:viewCuratorial, writing:viewWriting, cv:viewCV, contact:viewContact})[r.name]();
}
function mount(r){
  morph && morph.destroy(); morph = null; hydrate.onResize = null;
  hydrate.cleanup && hydrate.cleanup(); hydrate.cleanup = null;
  main.innerHTML = viewFor(r);
  const pr = r.name==='project' && PROJECTS.find(x=>x.slug===r.slug);
  document.title = r.name==='home' ? 'Andrea Valentine-Lewis — Curator & Writer' : (pr ? pr.title : LABEL[r.name]) + ' — Andrea Valentine-Lewis';
  $$('[data-nav]').forEach(a=>a.classList.toggle('on', a.dataset.nav===(r.name==='project'?'curatorial':r.name)));
  document.documentElement.classList.toggle('is-home', r.name==='home');
  document.documentElement.classList.toggle('is-cx', r.name==='curatorial');
  scrollTo(0,0);
  hydrate();
}
let current = null;
let cameFrom = null, viaNav = false;   // the route we just left, and whether the nav took us here (the curatorial index uses both)
$('.nav').addEventListener('click', e=>{ if(e.target.closest('a[data-nav]')) viaNav = true });
async function go(){
  const r = parse(); closeLB();
  if(!current){ current = r; mount(r); return }
  cameFrom = current; current = r;
  main.classList.add('out'); await wait(180);
  mount(r); main.classList.remove('out'); viaNav = false;
}
addEventListener('hashchange', go);

// cv: drop-downs slide open and fade in (and fold away) instead of snapping
const still = matchMedia('(prefers-reduced-motion: reduce)');
document.addEventListener('click', e=>{
  const s = e.target.closest('.cr details > summary');
  if(!s || e.target.closest('a') || still.matches) return;
  e.preventDefault();
  const d = s.parentElement, b = s.nextElementSibling;
  const opening = !d.open || d._closing;
  const from = d._a ? b.getBoundingClientRect().height : null;
  if(d._a) d._a.cancel();
  d.open = true;
  const h = b.offsetHeight;
  b.style.overflow = 'hidden';
  d._closing = !opening;
  // padding folds with the height (otherwise it stops 11px short and snaps); fill holds the end until open is set
  const shut = {height:'0px', paddingTop:'0px', paddingBottom:'0px', opacity:0};
  const a = d._a = b.animate(opening
    ? [from ? {height:`${from}px`, opacity:.5} : {...shut, transform:'translateY(-4px)'}, {height:`${h}px`, opacity:1, transform:'none'}]
    : [{height:`${from??h}px`, opacity:1}, shut],
    {duration: opening ? 560 : 320, easing: opening ? 'cubic-bezier(.22,1,.36,1)' : 'cubic-bezier(.4,0,.6,1)', fill:'forwards'});
  a.onfinish = () => { if(!opening) d.open = false; a.cancel(); b.style.overflow = ''; d._a = null; d._closing = false };
});

const sky = $('#sky');
function beat(){ sky.classList.remove('pop'); void sky.offsetWidth; sky.classList.add('pop') }
sky.addEventListener('animationend', ()=>sky.classList.remove('pop'));

// loader: once the heart is drawn and the page has loaded (never later than 4.5s), it flutters
// up to the nav, the paper behind it clears, and it becomes the colour-scheme button
(()=>{
  const ld = $('#ld'); if(!ld) return;
  if(still.matches) return ld.remove();
  const root = document.documentElement; root.classList.add('loading');
  const drawn = new Promise(r=>setTimeout(r, 1950));
  const loaded = new Promise(r=>document.readyState==='complete' ? r() : addEventListener('load', r, {once:true}));
  Promise.race([Promise.all([drawn, loaded]), new Promise(r=>setTimeout(r, 4500))]).then(()=>{
    const svg = $('svg', ld), a = $('path', ld).getBoundingClientRect(), b = $('path', sky).getBoundingClientRect();
    const dx = b.left + b.width/2 - a.left - a.width/2, dy = b.top + b.height/2 - a.top - a.height/2, s1 = b.width / a.width;
    // a quadratic swoop that swings out left and up before sweeping across, with a flutter that settles on landing
    const cx = -.25*dx, cy = .95*dy, len = Math.hypot(dx, dy) || 1, nx = -dy/len, ny = dx/len, N = 48, frames = [];
    for(let i=0;i<=N;i++){
      const t = i/N, u = t<.5 ? 4*t*t*t : 1 - (-2*t+2)**3/2, v = 1-u;
      const f = Math.sin(u*Math.PI*3) * 18 * v;
      const x = 2*v*u*cx + u*u*dx + nx*f, y = 2*v*u*cy + u*u*dy + ny*f;
      const s = (1 + (s1-1)*u) * (1 + .14*Math.sin(Math.min(t/.16, 1)*Math.PI));
      frames.push({transform:`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${(16*Math.sin(u*Math.PI*3.5)*v).toFixed(1)}deg) scale(${s.toFixed(3)})`});
    }
    ld.classList.add('fly');
    svg.animate(frames, {duration:1500, fill:'forwards'}).onfinish = () => { root.classList.remove('loading'); ld.remove(); beat() };
  });
})();

/* ---------------- PER-PAGE BEHAVIOUR ---------------- */
function hydrate(){
  setupName();
  setupCx();
  // project: images open in the viewer; text column sticks when it fits
  lbItems = $$('img.zoom', main);
  lbItems.forEach((el,i)=>el.addEventListener('click',()=>openLB(i)));
  stickText();
  // contact
  const cm = $('#copyMail', main);
  if(cm) cm.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(cm.dataset.mail); toast('Copied') } catch(e){ location.href='mailto:'+cm.dataset.mail }
  });
}
function stickText(){
  const t = $('#pjTxt', main); if(!t) return;
  const more = () => { t.classList.toggle('more', t.scrollTop + t.clientHeight < t.scrollHeight - 2); t.classList.toggle('past', t.scrollTop > 2) };
  if(!t._more){ t._more = true; t.addEventListener('scroll', more, {passive:true}) }
  more();
}
let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ hydrate.onResize && hydrate.onResize(); stickText() },120) });
document.fonts && document.fonts.ready.then(()=>{ hydrate.onResize && hydrate.onResize(); stickText() });
narrow.addEventListener('change',()=>hydrate.onResize && hydrate.onResize());

/* ---------------- LIGHTBOX ---------------- */
let lbItems=[], lbI=0;
const lb=$('#lb'), lbImg=$('#lbI');
function openLB(i){ lbI=i; setLB(); lb.classList.add('open'); $('#lbX').focus({preventScroll:true}) }
function closeLB(){ lb.classList.remove('open') }
function setLB(){
  const it=lbItems[lbI]; if(!it) return;
  lbImg.src=it.currentSrc||it.src; lbImg.alt=it.alt; $('#lbC').textContent=it.dataset.cap||''; $('#lbN').textContent=`${lbI+1} / ${lbItems.length}`;
}
const stepLB=d=>{ lbI=(lbI+d+lbItems.length)%lbItems.length; setLB() };
$('#lbX').addEventListener('click',closeLB);
$('#lbP').addEventListener('click',()=>stepLB(-1));
$('#lbNx').addEventListener('click',()=>stepLB(1));
addEventListener('keydown',e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLB(); if(e.key==='ArrowRight') stepLB(1); if(e.key==='ArrowLeft') stepLB(-1);
});
let tsx=0; lb.addEventListener('touchstart',e=>tsx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tsx; if(Math.abs(dx)>50) stepLB(dx<0?1:-1)});

/* ---------------- THEME (the heart: paper / red and pink) ---------------- */
function setTheme(t){ document.documentElement.dataset.theme=t; sky.setAttribute('aria-pressed', t==='love'); store.set('avl-theme',t) }
setTheme(store.get('avl-theme')==='love' ? 'love' : 'day');
sky.addEventListener('click',()=>{ setTheme(document.documentElement.dataset.theme==='love'?'day':'love'); beat() });
$$('img[data-src]').forEach(i=>i.src=im(i.dataset.src));

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1800) }

go();
</script>
